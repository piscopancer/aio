[package]
name = "aio"
version = "0.3.0"
description = "Local music player"
authors = ["piscopancer <piscopancer@gmail.com>"]
edition = "2024"
rust-version = "1.92"

[lib]
name = "aio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }
lofty = "0.25"
walkdir = "2"
rand = "0.9"
blake3 = "1"
diesel = { version = "2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2.3"
# not used directly, it switches on the bundled SQLite build that Diesel links against
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
tauri-plugin-decorum = "1.1.1"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
serde_json = "1"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
# the tag search: AcoustID fingerprints of the songs' sound, sent as URL-safe base64
rusty-chromaprint = "0.3"
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# the app's own shortcuts replace the browser ones (find, print, reload) the webview would otherwise handle
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# the taskbar preview's player buttons: the shell API, and icons drawn from the same SVGs the app shows; the media
# session the system media flyout and the media keys talk to
windows = { version = "0.62", features = [
  "Media",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
resvg = { version = "0.45", default-features = false }
